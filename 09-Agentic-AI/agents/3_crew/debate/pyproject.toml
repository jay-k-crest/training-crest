[project]
name = "debate"
version = "0.1.0"
description = "debate using crewAI with Pinecone"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0,<1.0.0",
    "python-dotenv>=1.0.0",
    "pinecone>=3.0.0",
    "groq>=0.9.0"  # For embeddings via Groq
]

[project.scripts]
debate = "debate.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"